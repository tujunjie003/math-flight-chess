<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数学飞行棋 · 课堂版</title>
<style>
/* ===== Game-specific layout ===== */
.game-wrap { max-width: 960px; margin: 0 auto; }

/* ===== Setup Screen ===== */
#setup-screen { display: flex; flex-direction: column; align-items: center; gap: var(--sp-5); padding: var(--sp-8) var(--sp-6); }
#setup-screen .header { text-align: center; padding: var(--sp-5) var(--sp-6); background: rgba(0,0,0,0.3); border-bottom: 3px solid var(--accent); border-radius: var(--r-xl); backdrop-filter: blur(12px); max-width: 600px; }
#setup-screen .header h1 { font-size: 1.8em; font-weight: 700; color: var(--warning); }
#setup-screen .header p { color: var(--text-secondary); margin-top: var(--sp-2); font-size: 0.9em; }
.setup-controls { display: flex; gap: var(--sp-3); align-items: center; flex-wrap: wrap; justify-content: center; }
select { flex: 1; min-width: 160px; padding: var(--sp-3) var(--sp-4); border: 2px solid var(--border); border-radius: var(--r-md); background: var(--surface); color: var(--text-primary); font-size: 0.95em; font-family: inherit; cursor: pointer; transition: border-color var(--duration-fast) var(--ease-out); }
select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-light); }
.semester-group { display: flex; gap: var(--sp-4); align-items: center; }
.semester-group label { display: flex; align-items: center; gap: var(--sp-1); cursor: pointer; color: var(--text-secondary); font-size: 0.9em; }
.semester-group input[type="radio"] { accent-color: var(--accent); width: 16px; height: 16px; cursor: pointer; }
.btn { padding: var(--sp-3) var(--sp-5); background: linear-gradient(135deg, var(--accent-dark), var(--accent)); border: none; border-radius: var(--r-md); color: #fff; font-size: 0.95em; font-weight: 600; font-family: inherit; cursor: pointer; box-shadow: 0 4px 16px rgba(124,58,237,0.35); transition: all var(--duration-base) var(--ease-out); transform: scale(0.97); opacity: 0.9; }
.btn:hover { transform: translateY(-2px) scale(1); opacity: 1; box-shadow: 0 8px 24px rgba(124,58,237,0.45); }
.btn:active { transform: scale(0.97); }

/* ===== Game Header ===== */
#game-header { display: flex; justify-content: space-between; align-items: center; padding: var(--sp-3) var(--sp-5); background: rgba(0,0,0,0.3); border-radius: var(--r-lg); margin-bottom: var(--sp-4); backdrop-filter: blur(8px); border: 1px solid var(--border); }
#game-header .team-info { font-size: 1.1em; font-weight: 600; color: var(--text-primary); }
#game-header .grade-info { font-size: 0.85em; color: var(--text-secondary); }
#header-phase { font-size: 1.2em; font-weight: 700; color: var(--accent); text-align: center; }

/* ===== Board ===== */
#board { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-xl); padding: var(--sp-4); overflow-x: auto; }
.board-cells { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.cell { width: 48px; height: 48px; background: var(--surface-hover); border: 1px solid var(--border); border-radius: var(--r-md); display: flex; align-items: center; justify-content: center; font-size: 0.85em; font-weight: 600; color: var(--text-secondary); position: relative; flex-shrink: 0; transition: all var(--duration-base); }
.cell-start { background: rgba(52,199,89,0.15); border-color: var(--success); color: var(--success); }
.cell-finish { background: rgba(251,191,36,0.15); border-color: var(--warning); color: var(--warning); }
.token { width: 16px; height: 16px; border-radius: 50%; position: absolute; border: 2px solid rgba(255,255,255,0.5); }
.token-0 { bottom: 2px; right: 2px; }
.token-1 { bottom: 2px; left: 2px; }
.token-2 { top: 2px; right: 2px; }
.token-3 { top: 2px; left: 2px; }

/* ===== Team Panels ===== */
.team-panels { display: grid; gap: var(--sp-3); margin-bottom: var(--sp-4); }
.team-panels[data-count="2"] { grid-template-columns: repeat(2, 1fr); }
.team-panels[data-count="3"] { grid-template-columns: repeat(3, 1fr); }
.team-panels[data-count="4"] { grid-template-columns: repeat(4, 1fr); }
.team-panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: var(--sp-3) var(--sp-4); transition: all var(--duration-base); }
.team-panel.active { border-color: var(--accent); box-shadow: 0 0 12px var(--accent-light); }
.team-panel.finished { opacity: 0.6; }
.team-name { font-size: 1.1em; font-weight: 700; }
.team-pos { font-size: 0.85em; color: var(--text-secondary); margin-top: var(--sp-1); }
.team-score { font-size: 0.8em; color: var(--text-muted); margin-top: var(--sp-1); }

/* ===== Dice ===== */
.dice-area { text-align: center; padding: var(--sp-5); }
#dice-display { font-size: 3em; font-weight: 800; color: var(--warning); min-width: 80px; display: inline-block; transition: transform 0.15s; }

/* ===== Question ===== */
#question-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-xl); padding: var(--sp-3); text-align: center; margin-bottom: var(--sp-3); }
#question-text { font-size: 1.6em; font-weight: 700; color: var(--warning); margin-bottom: var(--sp-2); font-variant-numeric: tabular-nums; }
.answer-row { display: flex; gap: var(--sp-2); justify-content: center; align-items: center; flex-wrap: wrap; }
#answer-input { width: 120px; padding: var(--sp-2) var(--sp-3); border: 2px solid var(--border); border-radius: var(--r-md); background: var(--surface-hover); color: var(--text-primary); font-size: 1em; font-family: inherit; text-align: center; }
#answer-input:focus { outline: none; border-color: var(--accent); }
.result-text { font-size: 1.1em; font-weight: 700; margin-bottom: var(--sp-1); }
.result-detail { font-size: 0.85em; color: var(--text-secondary); min-height: 1.2em; }

/* ===== Controls ===== */
.controls { display: flex; gap: var(--sp-3); justify-content: center; flex-wrap: wrap; }
.controls .btn { min-width: 100px; }

/* ===== Result Screen ===== */
#result-screen { display: flex; flex-direction: column; align-items: center; gap: var(--sp-5); padding: var(--sp-8) var(--sp-6); }
#result-screen .header { text-align: center; }
#winner-name { font-size: 2em; font-weight: 800; }
#winner-msg { color: var(--text-secondary); margin-top: var(--sp-2); font-size: 1.1em; }
#scoreboard { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-xl); padding: var(--sp-4) var(--sp-5); width: 100%; max-width: 400px; }
.score-row { padding: var(--sp-2) var(--sp-3); font-size: 1em; border-radius: var(--r-sm); margin-bottom: var(--sp-2); }

/* ===== Responsive ===== */
@media (max-width: 600px) { .team-panels { grid-template-columns: repeat(2, 1fr); } .cell { width: 36px; height: 36px; font-size: 0.75em; } }
</style>
  <script type="module" crossorigin src="./assets/main-B1M0fh-d.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/StorageService-ClyGpF2g.js">
  <link rel="stylesheet" crossorigin href="./assets/main-DdTYJK8k.css">
</head>
<body>
<div class="game-wrap">

  <!-- Setup Screen -->
  <div id="setup-screen">
    <div class="header">
      <h1>🎲 数学飞行棋 · 课堂版</h1>
      <p>1~4队同屏竞技，率先到达终点者获胜</p>
    </div>
    <div class="setup-controls">
      <select id="grade-select" aria-label="选择年级">
        <option value="1">1年级</option>
        <option value="2">2年级</option>
        <option value="3">3年级</option>
      </select>
      <select id="team-count-select" aria-label="选择队伍数量">
        <option value="2">2队</option>
        <option value="3">3队</option>
        <option value="4" selected>4队</option>
      </select>
      <div class="semester-group" role="group" aria-label="选择学期">
        <label><input type="radio" name="semester" value="上" checked> 上学期</label>
        <label><input type="radio" name="semester" value="下"> 下学期</label>
      </div>
      <button class="btn" id="start-btn" aria-label="开始游戏">🚀 开始游戏</button>
    </div>
  </div>

  <!-- Game Screen -->
  <div id="game-screen" style="display:none">
    <div id="game-header">
      <div class="team-info"><span id="header-turn">当前回合：红队</span></div>
      <div id="header-phase"></div>
      <div class="grade-info"><span id="header-grade">1年级上学期</span></div>
    </div>
    <div class="team-panels">
      <div class="team-panel active" data-team-id="0"><div class="team-name" style="color:#ef4444">红队</div><div class="team-pos">第 0 格</div><div class="team-score">积分 0</div></div>
      <div class="team-panel" data-team-id="1"><div class="team-name" style="color:#3b82f6">蓝队</div><div class="team-pos">第 0 格</div><div class="team-score">积分 0</div></div>
      <div class="team-panel" data-team-id="2"><div class="team-name" style="color:#f59e0b">黄队</div><div class="team-pos">第 0 格</div><div class="team-score">积分 0</div></div>
      <div class="team-panel" data-team-id="3"><div class="team-name" style="color:#22c55e">绿队</div><div class="team-pos">第 0 格</div><div class="team-score">积分 0</div></div>
    </div>
    <div id="board"></div>
    <div class="dice-area">
      <div id="dice-display">?</div>
    </div>
    <div id="question-box" style="display:none">
      <div id="question-text"></div>
      <div class="answer-row">
        <input type="number" id="answer-input" placeholder="输入答案" aria-label="答案">
      </div>
      <div id="result-text" class="result-text" style="margin-top:var(--sp-3)"></div>
      <div id="result-detail" class="result-detail"></div>
    </div>
    <div class="controls">
      <button class="btn" id="dice-btn" style="display:none">🎲 掷骰子</button>
      <button class="btn" id="correct-btn" style="display:none">✅ 回答正确</button>
      <button class="btn" id="wrong-btn" style="display:none">❌ 回答错误</button>
      <button class="btn" id="next-team-btn" style="display:none">➡️ 下一队</button>
    </div>
  </div>

  <!-- Result Screen -->
  <div id="result-screen" style="display:none">
    <div class="header">
      <div id="winner-name"></div>
      <div id="winner-msg"></div>
    </div>
    <div id="scoreboard"></div>
    <button class="btn" id="restart-btn">🔄 再来一局</button>
  </div>

</div>
</body>
</html>
